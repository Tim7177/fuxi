<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试题</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --primary: #2563eb; --primary-soft: #eff6ff;
    --ok: #15803d; --ok-soft: #ecfdf3; --bad: #c2410c; --bad-soft: #fff4ed;
    --half: #a16207; --half-soft: #fefce8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 120px; }
  header h1 { font-size: 24px; margin: 0 0 4px; }
  header .meta { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 14px 0; }
  .section-title { font-weight: 600; color: var(--muted); margin: 28px 0 6px; font-size: 15px; }
  .q-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .q-no { font-weight: 700; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: #f1f5f9; color: var(--muted); }
  .stem { white-space: pre-wrap; }
  .opts { margin-top: 10px; display: grid; gap: 6px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; }
  .opt:hover { border-color: var(--primary); }
  .opt input { margin-top: 6px; }
  .opt.sel { border-color: var(--primary); background: var(--primary-soft); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
  .blank { width: 9em; padding: 2px 6px; margin: 0 4px; border: none; border-bottom: 2px solid #94a3b8;
    font: inherit; background: transparent; text-align: center; }
  .blank:focus { outline: none; border-color: var(--primary); }
  .blank.ok { border-color: var(--ok); color: var(--ok); }
  .blank.bad { border-color: var(--bad); color: var(--bad); }
  textarea { width: 100%; min-height: 110px; margin-top: 10px; padding: 10px; font: inherit;
    border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .card.st-correct { border-left: 5px solid var(--ok); }
  .card.st-wrong { border-left: 5px solid var(--bad); }
  .card.st-partial, .card.st-pending { border-left: 5px solid var(--half); }
  .fb { margin-top: 12px; padding: 12px 14px; border-radius: 8px; font-size: 15px; }
  .fb.correct { background: var(--ok-soft); }
  .fb.wrong { background: var(--bad-soft); }
  .fb.partial, .fb.pending { background: var(--half-soft); }
  .fb .verdict { font-weight: 700; }
  .fb .row { margin-top: 4px; }
  .fb .label { color: var(--muted); }
  .fb .points label { display: block; cursor: pointer; }
  .selfbtns button { margin: 6px 6px 0 0; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; }
  button:hover { border-color: var(--primary); }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.on { background: var(--primary-soft); border-color: var(--primary); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96);
    border-top: 1px solid var(--line); backdrop-filter: blur(6px); }
  .bar .inner { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap; }
  button.ghost { color: var(--muted); background: transparent; }
  .bar .progress { color: var(--muted); font-size: 14px; margin-right: auto; }
  .score-big { font-size: 40px; font-weight: 800; }
  .score-big small { font-size: 18px; color: var(--muted); font-weight: 400; }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; color: var(--muted); margin: 4px 0 12px; }
  .stats b { color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .meter { height: 8px; background: #eef0f3; border-radius: 99px; overflow: hidden; min-width: 80px; }
  .meter i { display: block; height: 100%; border-radius: 99px; }
  .hidden { display: none !important; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff;
    padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
  .level-box { margin: 4px 0 14px; padding: 10px 12px; border-radius: 8px; font-size: 15px; }
  .level-box.pass { background: var(--ok-soft); }
  .level-box.fail { background: var(--half-soft); }
  .next-btn { display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 8px; background: var(--ok); color: #fff; text-decoration: none; }
  /* 材料题组、插图、公式、加点字、作文 */
  .material { background: #fbfaf6; border: 1px solid var(--line); border-left: 5px solid #94a3b8; border-radius: 12px; padding: 14px 18px; margin: 14px 0 6px; }
  .material .m-title { font-weight: 700; margin-bottom: 4px; }
  .material .m-range { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .material .m-text { white-space: pre-wrap; }
  details.mat { background: #fbfaf6; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; font-size: 15px; }
  details.mat summary { cursor: pointer; color: var(--muted); }
  details.mat .m-text { white-space: pre-wrap; margin-top: 4px; }
  .fig { margin: 8px 0; text-align: center; }
  .fig svg, .fig img { max-width: 100%; height: auto; }
  .dot { text-emphasis: dot; -webkit-text-emphasis: dot; text-emphasis-position: under right; -webkit-text-emphasis-position: under right; }
  .uline { text-decoration: underline; text-underline-offset: 3px; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 2px; }
  .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
  .sqrt { border-top: 1px solid currentColor; padding: 0 2px; margin-left: 1px; }
  .req { font-size: 14px; color: var(--muted); margin: 6px 0; padding-left: 20px; }
  textarea.essay { min-height: 280px; line-height: 1.8; }
  .wc { font-size: 13px; color: var(--muted); text-align: right; margin-top: 4px; }
  .wc.bad { color: var(--bad); }
  .dims { display: grid; gap: 6px; margin-top: 6px; }
  .dim { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dim b { min-width: 6em; }
  .dim select { font: inherit; padding: 2px 6px; }
  .dim .d-desc { font-size: 13px; color: var(--muted); flex-basis: 100%; }
  details.sample { margin-top: 8px; }
  details.sample summary { cursor: pointer; color: var(--primary); }
  details.sample .s-text { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 6px; }
  .q-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  .q-actions button { background: var(--primary); color: #fff; border-color: var(--primary); }
  .why-box { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: #fff; border: 1px solid #f5c9b3; }
  .why-box .h { font-weight: 700; color: var(--bad); margin-bottom: 2px; }
  .fix-box { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--primary-soft); }
  .fix-box .h { font-weight: 700; color: var(--primary); margin-bottom: 2px; }
  details.exp { margin-top: 6px; }
  details.exp summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  @media print { .bar, .actions { display: none; } }
</style>
</head>

<div class="wrap">

</div>

  </span>
</div></div>

      } else {
        for (var i = 0; i < n; i++) {
          var ok = !!user[i] && accepts[i].map(norm).indexOf(user[i]) >= 0;
          detail[i] = ok; if (ok) okCount++;
        }
      }
      got = full * okCount / n;
      status = okCount === n ? "correct" : okCount > 0 ? "partial" : "wrong";
    } else if (q.type === "essay") { // 作文：按评分维度自评
      var es = state.self[q.id], rub = q.rubric || [];
      if (!isAnswered(q)) { status = "wrong"; got = 0; }
      else if (!rub.length) {
        if (!es || es.level == null) { status = "pending"; got = 0; }
        else { got = full * es.level; status = es.level >= 0.85 ? "correct" : es.level > 0 ? "partial" : "wrong"; }
      } else if (!es || !es.dims || rub.some(function (r, k) { return es.dims[k] == null; })) { status = "pending"; got = 0; }
      else {
        got = es.dims.reduce(function (x, y) { return x + Number(y || 0); }, 0);
        status = got >= full * 0.85 ? "correct" : got > 0 ? "partial" : "wrong";
      }
    } else { // short：自评
      var s = state.self[q.id];
      if (q.points && q.points.length) {
        if (!s || !s.checked) { status = "pending"; got = 0; }
        else {
          var c = s.checked.filter(Boolean).length;
          got = full * c / q.points.length;
          status = c === q.points.length ? "correct" : c > 0 ? "partial" : "wrong";
        }
      } else {
        if (!s || s.level == null) { status = "pending"; got = 0; }
        else { got = full * s.level; status = s.level === 1 ? "correct" : s.level > 0 ? "partial" : "wrong"; }
      }
      if (!isAnswered(q) && status === "pending") { status = "wrong"; }
    }
    return { status: status, got: round1(got), full: full, detail: detail };
  }

  // ---------- 渲染 ----------
  function render() {
    document.title = QUIZ.title;
    document.getElementById("title").textContent = QUIZ.title;
    var total = qs.reduce(function (s, q) { return s + maxScore(q); }, 0);
    document.getElementById("meta").textContent = [NAV ? "第 " + NAV.level + " 级 · " + NAV.label : "", QUIZ.grade, QUIZ.subject,
      "共 " + qs.length + " 题", "满分 " + total + " 分", NAV ? "达标线 " + NAV.pass + "%" : ""]
      .filter(Boolean).join(" · ");

    var box = document.getElementById("questions");
    box.innerHTML = "";
    var lastSec = null, sectionNo = 0, lastGroup = null;
    qs.forEach(function (q, idx) {
      if (q._sec !== lastSec) {
        sectionNo++;
        var t = document.createElement("div");
        t.className = "section-title";
        t.textContent = "一二三四五六七八九十".charAt(sectionNo - 1) + "、" + secName(q._sec);
        t.dataset.section = q._sec;
        box.appendChild(t);
        lastSec = q._sec;
      }
      if (q._group != null && q._group !== lastGroup) {
        var G = GROUPS[q._group], subs = qs.filter(function (x) { return x._group === q._group; });
        var first = qs.indexOf(subs[0]) + 1, last = qs.indexOf(subs[subs.length - 1]) + 1;
        var m = document.createElement("div");
        m.className = "material"; m.id = "m-" + q._group; m.dataset.group = q._group;
        m.innerHTML = (G.title ? '<div class="m-title">' + fmt(G.title) + "</div>" : "") +
          '<div class="m-range">阅读材料，完成第 ' + first + (last > first ? "–" + last : "") + " 题</div>" +
          '<div class="m-text">' + fmt(G.material || "") + "</div>" + figure(G.figure);
        box.appendChild(m);
      }
      lastGroup = q._group != null ? q._group : null;
      box.appendChild(renderQuestion(q, idx + 1));
    });
    applyVisibility();
    renderSummary();
    updateBar();
  }

  function renderQuestion(q, no) {
    var g = isDone(q) ? grade(q) : null;
    var card = document.createElement("div");
    card.className = "card" + (g ? " st-" + g.status : "");
    card.id = "q-" + q.id;
    card.dataset.qid = q.id;
    var locked = isDone(q);

    var head = '<div class="q-head"><span class="q-no">' + no + '.</span>' +
      (q.knowledge ? '<span class="tag">' + esc(q.knowledge) + '</span>' : "") +
      (q.difficulty ? '<span class="tag">' + esc(q.difficulty) + '</span>' : "") +
      '<span class="tag">' + maxScore(q) + ' 分</span></div>';
    var body = "";
    var a = state.answers[q.id];

    if (q.type === "fill") {
      var i = 0, vals = a || [], det = g && g.detail;
      var stemHtml = fmt(q.stem).replace(BLANK_RE, function () {
        var k = i++, cls = det ? (det[k] ? " ok" : " bad") : "";
        return '<input class="blank' + cls + '" data-blank="' + k + '" value="' + esc(vals[k] || "") + '"' + (locked ? " disabled" : "") + ">";
      });
      if (i === 0) { // 题干里没写下划线，就在后面补输入框
        for (var j = 0; j < blankCount(q); j++) {
          var c2 = det ? (det[j] ? " ok" : " bad") : "";
          stemHtml += ' <input class="blank' + c2 + '" data-blank="' + j + '" value="' + esc(vals[j] || "") + '"' + (locked ? " disabled" : "") + ">";
        }
      }
      body = '<div class="stem">' + stemHtml + "</div>";
    } else {
      body = '<div class="stem">' + fmt(q.stem) + (q.type === "multiple" ? "（多选）" : "") + "</div>";
    }
    // 单独出现的材料（如错题重做里的题组小题）
    if (q.material && q._group == null) {
      body = '<details class="mat" open><summary>' + fmt(q.material_title || "材料") + '</summary><div class="m-text">' +
        fmt(q.material) + "</div>" + figure(q.material_figure) + "</details>" + body;
    }
    body += figure(q.figure);
    if (q.type === "essay" && q.requirements) {
      var reqs = Array.isArray(q.requirements) ? q.requirements : [q.requirements];
      body += '<ul class="req">' + reqs.map(function (r) { return "<li>" + fmt(r) + "</li>"; }).join("") + "</ul>";
    }

    if (q.type === "single" || q.type === "multiple" || q.type === "judge") {
      var opts = q.type === "judge" ? [["T", "正确 ✓"], ["F", "错误 ✗"]]
        : q.options.map(function (o, k) { return [LETTERS[k], o]; });
      body += '<div class="opts">';
      opts.forEach(function (o) {
        var key = o[0], sel;
        if (q.type === "multiple") sel = !!(a && a.indexOf(key) >= 0);
        else if (q.type === "judge") sel = (a === true && key === "T") || (a === false && key === "F");
        else sel = a === key;
        var cls = "opt" + (sel ? " sel" : "");
        if (g) {
          var isRight = q.type === "judge" ? ((key === "T") === q.answer)
            : q.type === "multiple" ? q.answer.indexOf(key) >= 0 : q.answer === key;
          if (isRight) cls += " right"; else if (sel) cls += " wrongpick";
        }
        body += '<label class="' + cls + '"><input type="' + (q.type === "multiple" ? "checkbox" : "radio") +
          '" name="q' + q.id + '" value="' + key + '"' + (sel ? " checked" : "") + (locked ? " disabled" : "") +
          "><span>" + (q.type === "judge" ? esc(o[1]) : key + ". " + fmt(o[1])) + "</span></label>";
      });
      body += "</div>";
    }
    if (q.type === "short") {
      body += '<textarea placeholder="在这里写你的答案…"' + (locked ? " disabled" : "") + ">" + esc(a || "") + "</textarea>";
    }
    if (q.type === "essay") {
      body += '<textarea class="essay" placeholder="' + (essayLang(q) === "en" ? "Write your composition here…" : "在这里写作文…") + '"' +
        (locked ? " disabled" : "") + ">" + esc(a || "") + '</textarea><div class="wc" data-wc></div>';
    }
    if (!g && q.type !== "single" && q.type !== "judge") {
      body += '<div class="q-actions"><button data-submit>' +
        (q.type === "short" || q.type === "essay" ? "提交，看参考答案" : "提交本题") + "</button></div>";
    }
    if (g) body += renderFeedback(q, g);
    card.innerHTML = head + body;
    if (q.type === "essay") updateWc(card, q, a);
    bindQuestion(card, q);
    return card;
  }

  function updateWc(card, q, text) {
    var el = card.querySelector("[data-wc]"); if (!el) return;
    var n = countWords(q, text), w = q.words, unit = essayLang(q) === "en" ? "词" : "字";
    var bad = w && ((w[0] && n < w[0]) || (w[1] && n > w[1]));
    el.textContent = "已写 " + n + " " + unit + (w ? "（要求 " + (w[0] || "") + (w[1] ? "–" + w[1] : " 以上") + " " + unit + "）" : "");
    el.classList.toggle("bad", !!(bad && n));
  }

  function renderFeedback(q, g) {
    var verdict = { correct: "✅ 回答正确", wrong: "❌ 回答错误", partial: "🟡 部分正确", pending: "📝 请对照要点自评" }[g.status];
    if (q.type === "essay") verdict = { correct: "✅ 自评优秀", wrong: "❌ 还需重写", partial: "🟡 自评得分", pending: "📝 请按评分维度自评" }[g.status];
    var h = '<div class="fb ' + g.status + '"><div class="verdict">' + verdict +
      '<span style="float:right;font-weight:400">' + g.got + " / " + g.full + " 分</span></div>";
    if (q.type === "essay") {
      var es = state.self[q.id] || {}, rub = q.rubric || [];
      if (rub.length) {
        h += '<div class="row"><span class="label">按评分维度给自己打分：</span><div class="dims">' + rub.map(function (r, k) {
          var cur = es.dims ? es.dims[k] : null, opts = '<option value="">—</option>';
          for (var v = Number(r.score); v >= 0; v--) opts += '<option value="' + v + '"' + (cur === v ? " selected" : "") + ">" + v + "</option>";
          return '<div class="dim"><b>' + fmt(r.name) + '</b><select data-dim="' + k + '">' + opts + "</select><span>/ " + r.score + " 分</span>" +
            (r.desc ? '<span class="d-desc">' + fmt(r.desc) + "</span>" : "") + "</div>";
        }).join("") + "</div></div>";
      } else {
        h += '<div class="row selfbtns"><span class="label">自评：</span>' + [[1, "很满意"], [0.7, "还可以"], [0.4, "要重写"]].map(function (b) {
          return '<button data-level="' + b[0] + '"' + (es.level === b[0] ? ' class="on"' : "") + ">" + b[1] + "</button>"; }).join("") + "</div>";
      }
      if (q.points && q.points.length) h += '<div class="row"><span class="label">内容要点：</span>' + q.points.map(fmt).join("；") + "</div>";
      if (q.sample) h += '<details class="sample"><summary>先自评，再点开看范文</summary><div class="s-text">' + fmt(q.sample) + "</div></details>";
      h += '<div class="row"><span class="label">想要详细批改：</span>点「导出答题记录」，回到 Claude 说「批改作文」，会逐句改错并给升格建议。</div>';
    } else if (q.type !== "short") {
      h += '<div class="row"><span class="label">你的答案：</span>' + esc(userText(q)) + "</div>";
      h += '<div class="row"><span class="label">正确答案：</span><b>' + fmt(correctText(q)) + "</b></div>";
      if (g.status === "correct") {
        if (q.explanation) h += '<details class="exp"><summary>看讲解</summary><div class="row">' + fmt(q.explanation) + "</div></details>";
      } else {
        h += '<div class="why-box"><div class="h">为什么错</div>' + (q.explanation ? fmt(q.explanation) : "对照正确答案，找出和你的答案不同的地方。") + "</div>";
        h += fixBox(q);
      }
      return h + "</div>";
    } else {
      h += '<div class="row"><span class="label">参考答案：</span>' + fmt(q.answer) + "</div>" + figure(q.answer_figure);
      var s = state.self[q.id] || {};
      if (q.points && q.points.length) {
        h += '<div class="row points"><span class="label">得分要点（勾选你答到的）：</span>';
        q.points.forEach(function (p, k) {
          var ck = s.checked && s.checked[k];
          h += '<label><input type="checkbox" data-point="' + k + '"' + (ck ? " checked" : "") + "> " + fmt(p) + "</label>";
        });
        h += "</div>";
      } else {
        h += '<div class="row selfbtns"><span class="label">自评：</span>' +
          [[1, "全答对"], [0.5, "答对一部分"], [0, "没答对"]].map(function (b) {
            return '<button data-level="' + b[0] + '"' + (s.level === b[0] ? ' class="on"' : "") + ">" + b[1] + "</button>";
          }).join("") + "</div>";
      }
    }
    if (q.explanation) h += '<div class="row"><span class="label">讲解：</span>' + fmt(q.explanation) + "</div>";
    if (q.type === "short" && (g.status === "wrong" || g.status === "partial")) h += fixBox(q);
    return h + "</div>";
  }

  // 怎么改进：主要给理科（数学、物理、化学）。有 tip 就显示 tip；理科没写 tip 时给通用的解题检查方法；文科没写 tip 就不显示
  var SCIENCE = ["数学", "物理", "化学"];
  function fixBox(q) {
    var t;
    if (q.tip) t = fmt(q.tip);
    else if (SCIENCE.indexOf(QUIZ.subject) >= 0)
      t = "按「已知量 → 用哪个公式 / 规律 → 代入（带单位）→ 检查结果」把这题重做一遍，对照讲解找出卡在哪一步：概念、公式、计算还是单位。整套做完后点「重做错题」再练一次。";
    else return "";
    return '<div class="fix-box"><div class="h">💡 怎么改进</div>' + t + "</div>";
  }

  function markDone(q) {
    state.done[q.id] = true;
    save(); refreshCard(q); updateBar();
    var pool = state.retryIds ? qs.filter(function (x) { return state.retryIds.indexOf(x.id) >= 0; }) : qs;
    if (pool.every(function (x) { return state.done[x.id]; })) finish(false);
  }

  function finish(scrollTop) {
    state.submitted = true; state.retryIds = null; state.submittedAt = new Date().toISOString();
    filterWrong = false; save(); renderSummary(); updateBar(); applyVisibility();
    if (scrollTop) window.scrollTo({ top: 0, behavior: "smooth" });
    else toast("这套题做完了，总结在页面最上方");
  }

  function bindQuestion(card, q) {
    if (!isDone(q)) {
      card.querySelectorAll('input[type=radio]').forEach(function (el) {
        el.addEventListener("change", function () {
          state.answers[q.id] = q.type === "judge" ? el.value === "T" : el.value;
          markDone(q);
        });
      });
      var sb = card.querySelector("[data-submit]");
      if (sb) sb.addEventListener("click", function () {
        if (!isAnswered(q)) { toast("先作答，再提交"); return; }
        markDone(q);
      });
      card.querySelectorAll('input[type=checkbox]').forEach(function (el) {
        el.addEventListener("change", function () {
          var arr = (state.answers[q.id] || []).filter(function (x) { return x !== el.value; });
          if (el.checked) arr.push(el.value);
          state.answers[q.id] = arr.sort();
          save(); refreshCard(q); updateBar();
        });
      });
      card.querySelectorAll("input.blank").forEach(function (el) {
        el.addEventListener("input", function () {
          var arr = state.answers[q.id] || [];
          arr[Number(el.dataset.blank)] = el.value;
          state.answers[q.id] = arr; save(); updateBar();
        });
      });
      var ta = card.querySelector("textarea");
      if (ta) ta.addEventListener("input", function () {
        state.answers[q.id] = ta.value; save(); updateBar();
        if (q.type === "essay") updateWc(card, q, ta.value);
      });
    } else if (q.type === "essay") {
      card.querySelectorAll("select[data-dim]").forEach(function (el) {
        el.addEventListener("change", function () {
          var s = state.self[q.id] || {}; s.dims = s.dims || [];
          s.dims[Number(el.dataset.dim)] = el.value === "" ? null : Number(el.value);
          state.self[q.id] = s; save(); refreshCard(q); renderSummary(); updateBar();
        });
      });
      card.querySelectorAll("button[data-level]").forEach(function (el) {
        el.addEventListener("click", function () {
          state.self[q.id] = { level: Number(el.dataset.level) }; save(); refreshCard(q); renderSummary(); updateBar();
        });
      });
    } else if (q.type === "short") {
      card.querySelectorAll("input[data-point]").forEach(function (el) {
        el.addEventListener("change", function () {
          var s = state.self[q.id] || { checked: q.points.map(function () { return false; }) };
          s.checked[Number(el.dataset.point)] = el.checked;
          state.self[q.id] = s; save(); refreshCard(q); renderSummary(); updateBar();
        });
      });
      card.querySelectorAll("button[data-level]").forEach(function (el) {
        el.addEventListener("click", function () {
          state.self[q.id] = { level: Number(el.dataset.level) }; save(); refreshCard(q); renderSummary(); updateBar();
        });
      });
    }
  }

  function refreshCard(q) {
    var old = document.getElementById("q-" + q.id);
    var no = qs.indexOf(q) + 1;
    var neu = renderQuestion(q, no);
    if (old.classList.contains("hidden")) neu.classList.add("hidden");
    old.replaceWith(neu);
  }

  function summaryData() {
    var total = 0, got = 0, counts = { correct: 0, partial: 0, wrong: 0, pending: 0 }, byK = {}, order = [];
    qs.forEach(function (q) {
      var g = grade(q);
      total += g.full; got += g.got; counts[g.status]++;
      var k = q.knowledge || "未分类";
      if (!byK[k]) { byK[k] = { full: 0, got: 0, n: 0, wrong: 0 }; order.push(k); }
      byK[k].full += g.full; byK[k].got += g.got; byK[k].n++;
      if (g.status === "wrong" || g.status === "partial") byK[k].wrong++;
    });
    return { total: total, got: round1(got), counts: counts, byK: byK, order: order };
  }

  function renderSummary() {
    var box = document.getElementById("summary");
    if (!state.submitted) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    var d = summaryData(), pct = d.total ? Math.round(d.got / d.total * 100) : 0;
    var color = pct >= 85 ? "var(--ok)" : pct >= 60 ? "var(--half)" : "var(--bad)";
    var h = '<div class="card"><div class="score-big" style="color:' + color + '">' + d.got +
      " <small>/ " + d.total + " 分（" + pct + "%）</small></div>";
    h += '<div class="stats"><span>✅ 全对 <b>' + d.counts.correct + "</b></span><span>🟡 部分对 <b>" + d.counts.partial +
      "</b></span><span>❌ 错误 <b>" + d.counts.wrong + "</b></span>" +
      (d.counts.pending ? "<span>📝 待自评 <b>" + d.counts.pending + "</b>（简答题、作文请往下翻对照要点自评）</span>" : "") +
      (state.attempt > 1 ? "<span>第 <b>" + state.attempt + "</b> 次作答</span>" : "") + "</div>";
    if (NAV) {
      var passed = pct >= NAV.pass;
      h += '<div class="level-box ' + (passed ? "pass" : "fail") + '">' +
        (d.counts.pending ? "简答题、作文自评完再看是否达标。" :
          passed ? "✅ <b>" + esc(NAV.label) + "达标</b>（" + pct + "% ≥ " + NAV.pass + "%）" +
            (NAV.next ? "，可以挑战下一级：" : "，三级全部完成！") :
          "⏳ <b>还没达标</b>（" + pct + "% / 达标线 " + NAV.pass + "%）。先看错题解析，导出答题记录让 Claude 分析，再点「重做错题」。") +
        (passed && NAV.next && !d.counts.pending ? ' <a class="next-btn" href="' + esc(NAV.next.href) + '">第 ' + NAV.next.level + " 级 · " + esc(NAV.next.label) + " →</a>" : "") +
        "</div>";
    }
    h += "<table><tr><th>知识点</th><th>题数</th><th>得分率</th><th></th></tr>";
    var rows = d.order.map(function (k) { var v = d.byK[k]; return [k, v, v.full ? v.got / v.full : 0]; })
      .sort(function (x, y) { return x[2] - y[2]; });
    rows.forEach(function (r) {
      var p = Math.round(r[2] * 100), c = p >= 85 ? "var(--ok)" : p >= 60 ? "var(--half)" : "var(--bad)";
      h += "<tr><td>" + esc(r[0]) + "</td><td>" + r[1].n + "</td><td>" + p + "%</td><td><div class=\"meter\"><i style=\"width:" +
        p + "%;background:" + c + '"></i></div></td></tr>';
    });
    h += "</table></div>";
    box.innerHTML = h;
  }

  function applyVisibility() {
    var showIds = null;
    if (!state.submitted && state.retryIds) showIds = state.retryIds;
    if (state.submitted && filterWrong) {
      showIds = qs.filter(function (q) { return grade(q).status !== "correct"; }).map(function (q) { return q.id; });
    }
    var visibleTypes = {};
    qs.forEach(function (q) {
      var el = document.getElementById("q-" + q.id);
      var show = !showIds || showIds.indexOf(q.id) >= 0;
      el.classList.toggle("hidden", !show);
      if (show) visibleTypes[q._sec] = true;
    });
    document.querySelectorAll(".material[data-group]").forEach(function (m) {
      var gid = m.dataset.group;
      m.classList.toggle("hidden", !qs.some(function (q) {
        return String(q._group) === gid && !document.getElementById("q-" + q.id).classList.contains("hidden"); }));
    });
    document.querySelectorAll(".section-title").forEach(function (t) {
      t.classList.toggle("hidden", !visibleTypes[t.dataset.section]);
    });
    document.getElementById("btn-filter").classList.toggle("on", filterWrong);
    document.getElementById("btn-filter").textContent = filterWrong ? "显示全部" : "只看错题";
  }

  function updateBar() {
    document.getElementById("before-actions").classList.toggle("hidden", state.submitted);
    document.getElementById("after-actions").classList.toggle("hidden", !state.submitted);
    var p = document.getElementById("progress");
    if (state.submitted) {
      var d = summaryData();
      p.textContent = "得分 " + d.got + " / " + d.total;
    } else {
      var pool = state.retryIds ? qs.filter(function (q) { return state.retryIds.indexOf(q.id) >= 0; }) : qs;
      var doneQs = pool.filter(function (q) { return state.done[q.id]; });
      var right = doneQs.filter(function (q) { return grade(q).status === "correct"; }).length;
      var wrongN = doneQs.filter(function (q) { var st = grade(q).status; return st === "wrong" || st === "partial"; }).length;
      p.textContent = (state.retryIds ? "重做错题 " : "已做 ") + doneQs.length + " / " + pool.length +
        (doneQs.length ? " · ✅ " + right + " · ❌ " + wrongN : "");
    }
  }

  // ---------- 操作 ----------
  function toast(msg) {
    var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  document.getElementById("btn-submit").addEventListener("click", function () {
    var pool = state.retryIds ? qs.filter(function (q) { return state.retryIds.indexOf(q.id) >= 0; }) : qs;
    var left = pool.filter(function (q) { return !state.done[q.id]; });
    if (left.length && !confirm("还有 " + left.length + " 题没做，现在结束吗？没做的会算错。")) {
      document.getElementById("q-" + left[0].id).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    finish(true); render();
  });

  document.getElementById("btn-filter").addEventListener("click", function () {
    filterWrong = !filterWrong; applyVisibility();
  });

  document.getElementById("btn-retry").addEventListener("click", function () {
    var wrong = qs.filter(function (q) { return grade(q).status !== "correct"; });
    if (!wrong.length) { toast("没有错题，全部答对了 🎉"); return; }
    if (!confirm("清空 " + wrong.length + " 道错题的答案并重新作答？答对的题会保留。")) return;
    wrong.forEach(function (q) { delete state.answers[q.id]; delete state.self[q.id]; delete state.done[q.id]; });
    state.retryIds = wrong.map(function (q) { return q.id; });
    state.submitted = false; state.attempt = (state.attempt || 1) + 1; filterWrong = false;
    save(); render(); window.scrollTo({ top: 0 });
  });

  // 重置：彻底清空这套题的作答记录（进度、得分、重做次数），回到没做过的状态，主页上也显示「未开始」
  document.getElementById("btn-clear").addEventListener("click", function () {
    if (!confirm("清空这套题的全部作答记录，回到没做过的状态？\n（包括已做的题、得分和重做次数，不能恢复）")) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state = { answers: {}, self: {}, done: {}, submitted: false, attempt: 1, retryIds: null };
    filterWrong = false; render(); window.scrollTo({ top: 0 });
    toast("已重置");
  });

  function buildRecord() {
    var d = summaryData();
    return {
      quiz_title: QUIZ.title, subject: QUIZ.subject, level: NAV ? NAV.level : null, level_name: NAV ? NAV.label : null, grade: QUIZ.grade, source: QUIZ.source, quiz_created: QUIZ.created,
      submitted_at: state.submittedAt || new Date().toISOString(), attempt: state.attempt || 1,
      score: d.got, total: d.total, percent: d.total ? Math.round(d.got / d.total * 100) : 0,
      counts: d.counts,
      by_knowledge: d.order.map(function (k) { var v = d.byK[k];
        return { knowledge: k, questions: v.n, wrong_or_partial: v.wrong, score: round1(v.got), total: v.full }; }),
      questions: qs.map(function (q, i) {
        var g = grade(q);
        var G = q._group != null ? GROUPS[q._group] : null;
        return { no: i + 1, id: q.id, type: TYPE_NAME[q.type], knowledge: q.knowledge, difficulty: q.difficulty,
          group: G ? { id: G.id, section: G.section || "材料题", title: G.title || "" } : undefined,
          stem: q.stem, options: q.options, user_answer: userText(q),
          correct_answer: q.type === "essay" ? "（作文，见评分维度和范文）" : correctText(q),
          words: q.type === "essay" ? countWords(q, state.answers[q.id]) : undefined,
          status: { correct: "正确", partial: "部分正确", wrong: "错误", pending: "待自评" }[g.status],
          score: g.got, full: g.full,
          self_check: (q.type === "short" || q.type === "essay") ? (state.self[q.id] || null) : undefined };
      })
    };
  }

  function stamp() {
    var t = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return t.getFullYear() + p(t.getMonth() + 1) + p(t.getDate()) + "-" + p(t.getHours()) + p(t.getMinutes());
  }

  document.getElementById("btn-export").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(buildRecord(), null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "答题记录_" + QUIZ.title.replace(/[\\\/:*?"<>|\s·]+/g, "_") + "_" + stamp() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    toast("已导出到「下载」文件夹，回到 Claude 说「分析我的错题」即可");
  });

  document.getElementById("btn-copy").addEventListener("click", function () {
    var r = buildRecord();
    var lines = ["【" + r.quiz_title + "】答题结果：" + r.score + " / " + r.total + " 分（" + r.percent + "%）", ""];
    r.questions.filter(function (q) { return q.status !== "正确" || q.type === "作文"; }).forEach(function (q) {
      lines.push(q.no + ". [" + q.type + "｜" + (q.knowledge || "") + "] " + (q.group ? "（" + q.group.section + (q.group.title ? "·" + q.group.title : "") + "）" : "") + q.stem);
      if (q.options) lines.push("   选项：" + q.options.map(function (o, k) { return LETTERS[k] + "." + o; }).join("  "));
      lines.push("   我的答案：" + q.user_answer);
      lines.push("   正确答案：" + q.correct_answer + "（" + q.status + "，" + q.score + "/" + q.full + "）");
      lines.push("");
    });
    lines.push(r.questions.some(function (q) { return q.type === "作文"; }) ? "请帮我分析错题，并批改作文。" : "请帮我分析错题。");
    var text = lines.join("\n");
    var done = function () { toast("已复制，粘贴给 Claude 即可"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  });
  function fallbackCopy(text) {
    var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }

  render();
})();
</script>
</body>
</html>
