<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>复习主页</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb; --primary:#2563eb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 720px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 2px 14px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: .5px; }
  .muted { color: var(--muted); font-size: 13px; }
  .sec { font-size: 15px; font-weight: 600; color: var(--muted); margin: 22px 2px 8px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .subj { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px 12px;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .subj:active { transform: scale(.97); }
  .subj.empty { opacity: .45; }
  .ico { width: 44px; height: 44px; border-radius: 12px; color: #fff; font-size: 21px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .subj b { font-size: 15px; }
  .subj .muted { font-size: 12px; line-height: 1.3; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .q-title { font-weight: 600; font-size: 16px; line-height: 1.45; }
  .q-meta { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: #f1f5f9; color: var(--muted); white-space: nowrap; }
  .badge.done { background: #ecfdf3; color: #15803d; }
  .badge.doing { background: #fefce8; color: #a16207; }
  .lvls { display: grid; gap: 6px; margin-top: 10px; }
  .lvl { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
  .lvl-n { font-size: 12px; color: var(--muted); min-width: 34px; }
  .lvl-name { flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
  .lvl-name .muted { font-size: 12px; }
  .lvl .chev { color: var(--muted); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { display: inline-block; padding: 8px 14px; border-radius: 10px; font-size: 14px; border: 1px solid var(--line); background: #fff; }
  .btn.main { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn:active { opacity: .7; }

  .row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .row:active { background: #f8fafc; }
  .row .name { flex: 1; min-width: 0; line-height: 1.4; word-break: break-all; }
  .kind { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: #eef2ff; color: #4338ca; white-space: nowrap; }
  .chev { color: #cbd5e1; font-size: 18px; }
  .empty-tip { color: var(--muted); font-size: 14px; padding: 14px 16px; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }

  .topbar { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
  .back { font-size: 15px; color: var(--primary); padding: 6px 2px; }
  .subj-head { display: flex; align-items: center; gap: 12px; margin: 6px 2px 4px; }
  .subj-head h1 { font-size: 24px; }
  .tabs { display: flex; gap: 6px; background: #e9ecf1; padding: 4px; border-radius: 12px; margin: 14px 0 12px; }
  .tab { flex: 1; text-align: center; padding: 7px 0; border-radius: 9px; font-size: 15px; color: var(--muted); }
  .tab.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  footer { margin-top: 30px; text-align: center; }
</style>
</head>

</div>

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function status(q) {
  var st = null;
  try { st = JSON.parse(localStorage.getItem(q.store)); } catch (e) {}
  if (!st) return { cls: "", text: "未开始", btn: "开始", rank: 0 };
  if (st.submitted) {
    var pct = st.percent, passed = pct != null && q.pass && pct >= q.pass && !st.pending;
    var text = pct != null ? "得分 " + pct + "%" + (passed ? " ✅" : "") : "已交卷";
    return { cls: passed ? "done" : "doing", text: text, btn: "看结果", rank: 1, passed: passed, t: st.submittedAt || "" };
  }
  var n = Object.keys(st.answers || {}).length;
  if (!n) return { cls: "", text: "未开始", btn: "开始", rank: 0 };
  return { cls: "doing", text: "答到 " + n + "/" + q.count, btn: "继续", rank: 2, t: "" };
}

// 通过到第几级：从第 1 级起连续达标的最高级
function passedLevel(u) {
  var best = 0;
  u.levels.filter(function (l) { return l.level; }).sort(function (a, b) { return a.level - b.level; })
    .some(function (l) { if (status(l).passed) { best = l.level; return false; } return true; });
  return best;
}

function unitCard(u) {
  var pl = passedLevel(u), graded = u.levels.some(function (l) { return l.level; });
  var meta = [];
  if (u.grade) meta.push('<span class="muted">' + esc(u.grade) + '</span>');
  if (graded) meta.push('<span class="badge ' + (pl ? "done" : "") + '">' + (pl ? "已通过第 " + pl + " 级" : "还没有达标的级别") + '</span>');
  var rows = u.levels.map(function (l) {
    var s = status(l);
    return '<a class="lvl" href="' + l.url + '"><span class="lvl-n">' + (l.level ? "第 " + l.level + " 级" : "") + '</span>' +
      '<span class="lvl-name"><b>' + esc(l.label) + '</b><span class="muted">' + l.count + ' 题' + (l.pass ? ' · 达标 ' + l.pass + '%' : '') + '</span></span>' +
      '<span class="badge ' + s.cls + '">' + esc(s.text) + '</span><span class="chev">›</span></a>';
  }).join("");
  var acts = (u.links || []).map(function (l) { return '<a class="btn" href="' + l.url + '">' + esc(l.label) + '</a>'; }).join("");
  return '<div class="card"><div class="q-title">' + esc(u.title) + '</div><div class="q-meta">' + meta.join("") + '</div>' +
    '<div class="lvls">' + rows + '</div>' + (acts ? '<div class="acts">' + acts + '</div>' : "") + '</div>';
}

// 「最近」列表里的单级卡片
function quizCard(q, showSubject) {
  var s = status(q);
  var meta = [];
  if (showSubject) meta.push('<span class="badge">' + esc(q.subject) + '</span>');
  meta.push('<span class="muted">' + q.count + ' 题</span>');
  meta.push('<span class="badge ' + s.cls + '">' + esc(s.text) + '</span>');
  return '<div class="card"><div class="q-title">' + esc(q.title) + '</div><div class="q-meta">' + meta.join("") +
    '</div><div class="acts"><a class="btn main" href="' + q.url + '">' + s.btn + '</a></div></div>';
}

function reviewCard(r) {
  var acts = r.modes.map(function (m, i) {
    return '<a class="btn' + (i === 0 ? " main" : "") + '" href="' + m.url + '">' + esc(m.label) + '</a>';
  }).join("");
  var meta = (r.grade ? '<span class="muted">' + esc(r.grade) + '</span>' : "") + '<span class="muted">选一个时间档，跟着计时器复习</span>';
  return '<div class="card"><div class="q-title">' + esc(r.title) + '</div><div class="q-meta">' + meta +
    '</div><div class="acts">' + acts + '</div></div>';
}

function outlineRow(o) {
  return '<a class="row" href="' + o.url + '"><span class="kind">' + esc(o.kind) + '</span><span class="name">' +
    esc(o.name) + '</span><span class="chev">›</span></a>';
}

function renderHome() {
  document.getElementById("updated").textContent = "更新于 " + DATA.updated;
  var grid = "", all = [];
  DATA.subjects.forEach(function (s) {
    var nq = s.quizzes.length, no = s.outlines.length, nr = (s.reviews || []).length;
    s.quizzes.forEach(function (u) { u.levels.forEach(function (l) {
      all.push({ subject: s.name, title: u.title + (l.level ? " · " + l.label : ""), count: l.count, created: l.created,
                 store: l.store, url: l.url, pass: l.pass });
    }); });
    var parts = [];
    if (nr) parts.push(nr + " 份复习");
    if (nq) parts.push(nq + " 份测试");
    if (no) parts.push(no + " 份提纲");
    var info = parts.length ? parts.join("<br>") : "暂无内容";
    grid += '<a class="subj' + (parts.length ? "" : " empty") + '" href="#' + encodeURIComponent(s.name) + '">' +
      '<span class="ico" style="background:' + s.color + '">' + esc(s.icon) + '</span><b>' + esc(s.name) +
      '</b><span class="muted">' + info + '</span></a>';
  });
  document.getElementById("grid").innerHTML = grid;

  // 最近：进行中的排前面，其次按出题日期，最多 3 套
  all.sort(function (a, b) {
    var sa = status(a), sb = status(b);
    if ((sa.rank === 2) !== (sb.rank === 2)) return sa.rank === 2 ? -1 : 1;
    return (b.created || "").localeCompare(a.created || "");
  });
  var recent = all.slice(0, 3);
  document.getElementById("recent-box").classList.toggle("hidden", !recent.length);
  document.getElementById("recent").innerHTML = recent.map(function (q) { return quizCard(q, true); }).join("");
}

function renderSubject(name, tab) {
  var s = DATA.subjects.filter(function (x) { return x.name === name; })[0];
  if (!s) { location.hash = ""; return; }
  var reviews = s.reviews || [];
  if (!tab) tab = reviews.length ? "r" : (s.quizzes.length || !s.outlines.length ? "q" : "o");
  document.title = s.name + " · 复习主页";
  var ico = document.getElementById("s-ico");
  ico.textContent = s.icon; ico.style.background = s.color;
  document.getElementById("s-name").textContent = s.name;
  var base = "#" + encodeURIComponent(s.name);
  var tq = document.getElementById("tab-q"), to = document.getElementById("tab-o"), tr = document.getElementById("tab-r");
  tq.href = base + "/q"; to.href = base + "/o"; tr.href = base + "/r";
  tr.textContent = "复习 " + reviews.length; tr.classList.toggle("on", tab === "r");
  tq.textContent = "测试题 " + s.quizzes.length; to.textContent = "复习提纲 " + s.outlines.length;
  tq.classList.toggle("on", tab === "q"); to.classList.toggle("on", tab === "o");
  var html;
  if (tab === "r") {
    html = reviews.length ? reviews.map(reviewCard).join("")
      : '<div class="empty-tip">这一科还没有复习计划。跟 Claude 说「我只有一小时复习' + esc(s.name) + '」就会生成。</div>';
  } else if (tab === "q") {
    html = s.quizzes.length ? s.quizzes.map(unitCard).join("")
      : '<div class="empty-tip">这一科还没有测试题。把提纲放进「01_复习提纲/' + esc(s.name) + '」，再让 Claude 出题。</div>';
  } else {
    html = s.outlines.length ? s.outlines.map(outlineRow).join("")
      : '<div class="empty-tip">这一科还没有上传复习提纲。</div>';
  }
  document.getElementById("s-list").innerHTML = html;
}

function route() {
  var h = decodeURIComponent(location.hash.replace(/^#/, ""));
  var home = !h;
  document.getElementById("home").classList.toggle("hidden", !home);
  document.getElementById("subject").classList.toggle("hidden", home);
  if (home) { document.title = "复习主页"; renderHome(); }
  else { var p = h.split("/"); renderSubject(p[0], p[1]); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("pageshow", function (e) { if (e.persisted) route(); });
route();
</script>
</body>
</html>
